services:
  jupetrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupetrack
    ports:
      - "3040:3040"
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://localhost:3041
    env_file:
      - ./backend-go/.env
    volumes:
      - ./backend-go/data:/app/backend-go/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: jupetrack_go
    ports:
      - "8085:8080"
    restart: unless-stopped
    env_file:
      - ./backend-go/.env
    volumes:
      - ./backend-go/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    container_name: jupetrack_victoriametrics
    ports:
      - "127.0.0.1:8428:8428"
      - "192.168.106.96:8430:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1y"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: jupetrack_grafana
    ports:
      - "127.0.0.1:3031:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=change-me
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - victoriametrics
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# volumes:
#   mysql_data:

volumes:
  victoriametrics-data:
  grafana-data:
