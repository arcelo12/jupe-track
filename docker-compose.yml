services:
  jupetrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupetrack
    ports:
      - "3040:3040"
    restart: always
    environment:
      - INTERNAL_API_URL=http://localhost:3041
    env_file:
      - ./backend-go/.env
    volumes:
      - ./backend-go/data:/app/backend-go/data

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: jupetrack_go
    ports:
      - "8085:8080"
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend-go/.env
    volumes:
      - ./backend-go/data:/app/data

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: jupetrack_victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=1y"
    restart: always

# volumes:
#   mysql_data:

volumes:
  victoriametrics-data:
